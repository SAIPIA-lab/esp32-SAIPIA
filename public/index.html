<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ESP32 Dashboard</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="container">

    <header>
      <h1>🚀 ESP32 Smart Drain</h1>
      <p>Sistema inteligente de monitoreo</p>
    </header>

    <section class="grid">

      <div class="card">
        <h2>💧 Nivel de Agua</h2>
        <p id="nivel">--</p>
      </div>

      <div class="card">
        <h2>📏 Distancia</h2>
        <p id="distancia">--</p>
      </div>

      <div class="card">
        <h2>⚙️ Modo</h2>
        <p id="modo">--</p>
      </div>

      <div class="card">
        <h2>🚨 Atasco</h2>
        <p id="atasco">--</p>
      </div>

      <div class="card">
        <h2>🌧 Lluvia</h2>
        <p id="lluvia">--</p>
      </div>

      <div class="card">
        <h2>⏱ Tiempo Activo</h2>
        <p id="tiempo">--</p>
      </div>

    </section>

    <section class="historial-container">

      <h2>📜 Historial</h2>

      <div id="historial"></div>

    </section>

  </div>

  <script src="script.js"></script>

</body>

</html>
